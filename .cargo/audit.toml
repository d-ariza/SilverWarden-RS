[advisories]
ignore = [
    # Marvin Attack (RUSTSEC-2023-0071): timing sidechannel in rsa crate.
    # Excepción aprobada y documentada: rsa es la única implementación madura en Rust para
    # RSA-OAEP-SHA1 (necesaria para descifrar el encKey legacy de Bitwarden en SW-006).
    # Su uso es local, confinado a descifrar encKey una única vez por sesión con datos propios en memoria,
    # no expuesto a medición remota de timing por atacantes de red.
    "RUSTSEC-2023-0071",

    # proc-macro-error unmaintained (RUSTSEC-2024-0370): dependencia transitiva de build de Tauri, fuera del MVP CLI
    "RUSTSEC-2024-0370",

    # glib unsound (RUSTSEC-2024-0429): dependencia transitiva de Tauri/GTK, excluida del MVP CLI
    "RUSTSEC-2024-0429",

    # zbus split-crate unmaintained advisories (RUSTSEC-2026-0370/0371/0372).
    # zbus 6.0.0 folded zvariant, zbus_names and zvariant_derive into itself.
    # Current Tauri v2 plugins and notify-rust still require zbus ^5, which
    # depends on the standalone crates. No patched release exists for zbus 5.
    # Remove when Tauri plugins migrate to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",

    # crypto-bigint (RUSTSEC-2026-0387): timing variability in crypto-bigint 0.5.5
    # Dependencia transitiva vía ssh-key 0.6.7 (ssh-key 0.7 estable pendiente).
    "RUSTSEC-2026-0387",
]
