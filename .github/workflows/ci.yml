name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests & Quality Controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --exclude sw-gui --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --exclude sw-gui --verbose

  fuzz:
    name: Fuzzing (5 min per target)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz EncString parser
        run: cd fuzz && cargo +nightly fuzz run fuzz_encstring_parse -- -max_total_time=300

      - name: Fuzz PKCS7 unpad
        run: cd fuzz && cargo +nightly fuzz run fuzz_pkcs7_unpad -- -max_total_time=300

      - name: Fuzz decrypt_with
        run: cd fuzz && cargo +nightly fuzz run fuzz_decrypt_with -- -max_total_time=300

      - name: Fuzz decrypt_with_asymmetric
        run: cd fuzz && cargo +nightly fuzz run fuzz_decrypt_with_asymmetric -- -max_total_time=300

