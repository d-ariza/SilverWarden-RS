[package]
name = "sw-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sw-crypto = { path = "../crates/sw-crypto" }

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "fuzz_encstring_parse"
path = "fuzz_targets/fuzz_encstring_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pkcs7_unpad"
path = "fuzz_targets/fuzz_pkcs7_unpad.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decrypt_with"
path = "fuzz_targets/fuzz_decrypt_with.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decrypt_with_asymmetric"
path = "fuzz_targets/fuzz_decrypt_with_asymmetric.rs"
test = false
doc = false
bench = false
